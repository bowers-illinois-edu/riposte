# Build the pkgdown site and deploy it to the gh-pages branch. Standard r-lib
# workflow. Enable GitHub Pages (Settings -> Pages -> Source: gh-pages) once the
# branch exists after the first run.
on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      # pkgdown renders every Markdown file at the package root as a page, and
      # .Rbuildignore does not stop it. POINT.md and CLAUDE.md are notes for
      # Claude Code sessions, and MINP_PLAN.md is a working plan; none is a page
      # of the website (Jake, 2026-11-16).
      - name: Keep the working notes off the website
        run: rm -f POINT.md CLAUDE.md MINP_PLAN.md

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          # clean: true removes pages that the new build no longer makes, such
          # as the POINT.html, CLAUDE.html, and MINP_PLAN.html published before
          # 2026-11-16
          clean: true
          branch: gh-pages
          folder: docs
